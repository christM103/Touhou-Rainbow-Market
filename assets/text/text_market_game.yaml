# Comment: Market Game Dialogue
# Text for the 'Market Game' scene

---
# Action Keys
prompt_yn: &yes_or_no_selection "prompt_yn"
display_mkt1: &display_market_tier_1 "display_mkt1"
display_mkt2: &display_market_tier_2 "display_mkt2"
display_mkt3: &display_market_tier_3 "display_mkt3"
display_mkta: &display_market_all_markets "display_mkta"
prompt_market: &market_selection_prompt "prompt_market"
prompt_land: &land_selection_prompt "prompt_land"

# Turn Intro Text
game_intro:
  text: "GAME START!"
first_turn:
  text: "Would you like to know how to play the game?"
  action: *yes_or_no_selection
game_explain:
  lines:
    - text: >
        Here's how to play the game.
    - text: >
        Your goal is to make as much profit as possible within the span of 10 turns.
    - text: >
        At the beginning, you are given two minutes for your turn to do what you are able to do. 
        But as the game progresses, the time speeds up, giving you less time for actions.
    - text: >
        There are going to be a set number of markets to buy at the start of the round.
    - text: >
        Each market has their own special ability, 
        whether it is the ability to attack markets from other players or protect your own. 
        You can use a total of two market abilities per turn.
    - text: >
        Your player also has their own dedicated action. 
        You can use only one player action per turn.
    - text: >
        Events also happen between every turn, but they are not currently implemented lol.
    - text: >
        By the end of the game, whoever has the largest profit is the winner. 
        But beware, you also instantly lose if you go bankrupt.
    - text: "Would you like to hear that again?"
      action: *yes_or_no_selection

# Market Operation Text
mkt_add_start:
  text: "Would you like a market this turn?"
  action: *yes_or_no_selection
mkt_add:
  text: "Would you like a market?"
  action: *yes_or_no_selection
mkt_intro_1:
  text: &current_market "Here are the current markets that are offered for this turn."
  action: *display_market_tier_1
mkt_intro_2:
  text: *current_market
  action: *display_market_tier_2
mkt_intro_3:
  text: *current_market
  action: *display_market_tier_3
mkt_intro_all:
  text: *current_market
  action: *display_market_all_markets
mkt_add_sel:
  text: "Which market do you want to get?"
  action: *market_selection_prompt
mkt_add_loc:
  text: "Where would you like to place the market?"
  action: *land_selection_prompt
mkt_err_occup:
  text: "There's already a space!\nDo you want to replace the current market with this new market?"
  action: *yes_or_no_selection
mkt_del:
  text: "Do you want to delete a market?"
  action: *yes_or_no_selection
mkt_del_sel:
  text: "Which market do you want delete?"
  action: *land_selection_prompt

# Main Game Text
turn_start:
  text: "Start of Turn {turn_number}!"
hud_debug_text:
  text: |
    Current Player - {player_char}
    Current Type - Type {player_type}
    Total Current Profit - {player_profit}
    Current Markets - {player_lot}
    Current Time - {game_timer}

    Use keys 1-6 to access land windows, Z to access player window, X to add new market
land_debug_txt:
  text: |
    Press X to exit, Press Z to activate power
    Actions Left - {player_act_mar}
    Active Market - {market_active}
    Market ID - {market_id}
plyr_debug_txt:
  text: |
    Press X to exit, Press Z to activate power
    Current Player - {player_char}
    Actions Left - {player_act_pla}
action_prompt:
  text: "Would you want to use your action?"
  action: *yes_or_no_selection
action_debug_success:
  text: "Action Succeeded!"
action_debug_failure:
  text: "Action Failed!"